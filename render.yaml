services:
  - type: web
    name: autobott-phase1-dashboard
    runtime: python
    buildCommand: pip install .
    startCommand: python -m autobott_v2.dashboard_app
    healthCheckPath: /api/health
    disks:
      - name: autobott-runtime
        mountPath: /var/data/autobott
        sizeGB: 1
    envVars:
      - key: ALPACA_ENV
        value: paper
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: AUTOBOTT_LIVE_TRADING_ENABLED
        value: "false"
      - key: AUTOBOTT_ALLOW_ORDER_PLACEMENT
        value: "true"
      - key: AUTOBOTT_MAX_POSITION_COST
        value: "1000"
      - key: AUTOBOTT_PAPER_IGNORE_POSITION_COST_LIMIT
        value: "true"
      - key: AUTOBOTT_MAX_DAILY_LOSS
        value: "5000"
      - key: AUTOBOTT_PAPER_TRADE_ALL_PASSED_SIGNALS
        value: "true"
      - key: AUTOBOTT_PAPER_MAX_NEW_ENTRY_ATTEMPTS_PER_LOOP
        value: "25"
      - key: AUTOBOTT_PAPER_MAX_OPEN_ENTRY_BUY_ORDERS
        value: "25"
      - key: AUTOBOTT_ENTRY_LIMIT_EXTRA
        value: "0.02"
      - key: AUTOBOTT_PENDING_ENTRY_MAX_AGE_SECONDS
        value: "180"
      - key: AUTOBOTT_OPEN_DRAWDOWN_GUARD_ENABLED
        value: "false"
      - key: AUTOBOTT_OPEN_DRAWDOWN_GUARD_MAX_UNREALIZED_LOSS
        value: "20"
      - key: AUTOBOTT_OPEN_DRAWDOWN_GUARD_MIN_LOSERS
        value: "3"
      - key: AUTOBOTT_OPEN_DRAWDOWN_GUARD_LOSS_RATE
        value: "0.60"
      - key: AUTOBOTT_DEFINED_RISK_SPREADS_ENABLED
        value: "true"
      - key: AUTOBOTT_SINGLE_LEG_REAL_ENTRIES_DISABLED
        value: "true"
      - key: AUTOBOTT_CORE_RUNNER_ENABLED
        value: "true"
      - key: AUTOBOTT_RUNNER_MAX_COST_RATIO
        value: "0.40"
      - key: AUTOBOTT_CORE_MAX_SPREAD_PCT
        value: "0.18"
      - key: AUTOBOTT_RUNNER_MAX_SPREAD_PCT
        value: "0.25"
      - key: AUTOBOTT_CORE_MIN_OPEN_INTEREST
        value: "100"
      - key: AUTOBOTT_RUNNER_MIN_OPEN_INTEREST
        value: "50"
      - key: AUTOBOTT_CORE_MIN_VOLUME
        value: "10"
      - key: AUTOBOTT_RUNNER_MIN_VOLUME
        value: "1"
      - key: AUTOBOTT_SPREAD_MAX_RISK
        value: "100"
      - key: AUTOBOTT_SPREAD_PROFIT_TARGET_PCT
        value: "0.50"
      - key: AUTOBOTT_EXIT_TAKE_PROFIT_PCT
        value: "0.30"
      - key: AUTOBOTT_EXIT_TAKE_PROFIT_TIGHTEN_PCT
        value: "0.50"
      - key: AUTOBOTT_EXIT_TAKE_PROFIT_HARVEST_PCT
        value: "0.80"
      - key: AUTOBOTT_EXIT_TAKE_PROFIT_FORCE_EXIT_PCT
        value: "1.20"
      - key: AUTOBOTT_RUNNER_EXIT_TAKE_PROFIT_PCT
        value: "1.00"
      - key: AUTOBOTT_RUNNER_EXIT_TRAILING_ACTIVATION_PCT
        value: "0.50"
      - key: AUTOBOTT_RUNNER_EXIT_TRAILING_DRAWDOWN_PCT
        value: "0.25"
      - key: AUTOBOTT_RUNNER_EXIT_STOP_LOSS_PCT
        value: "0.70"
      - key: AUTOBOTT_TAKE_PROFIT_LIMIT_PRICE_FACTOR
        value: "0.98"
      - key: AUTOBOTT_TAKE_PROFIT_REPRICE_FACTOR
        value: "0.97"
      - key: AUTOBOTT_TAKE_PROFIT_TIGHT_LIMIT_PRICE_FACTOR
        value: "0.97"
      - key: AUTOBOTT_TAKE_PROFIT_HARVEST_LIMIT_PRICE_FACTOR
        value: "0.95"
      - key: AUTOBOTT_POSITION_MONITOR_HEARTBEAT_ENABLED
        value: "true"
      - key: AUTOBOTT_POSITION_MONITOR_HEARTBEAT_SECONDS
        value: "15"
      - key: AUTOBOTT_RECENT_LOSS_GUARD_ENABLED
        value: "false"
      - key: AUTOBOTT_RECENT_LOSS_GUARD_LOOKBACK
        value: "20"
      - key: AUTOBOTT_RECENT_LOSS_GUARD_CONSECUTIVE_LOSSES
        value: "2"
      - key: AUTOBOTT_RECENT_LOSS_GUARD_MIN_SAMPLE
        value: "3"
      - key: AUTOBOTT_RECENT_LOSS_GUARD_LOSS_RATE
        value: "0.67"
      - key: AUTOBOTT_RECENT_WINNER_BIAS_ENABLED
        value: "true"
      - key: AUTOBOTT_RECENT_WINNER_BIAS_LOOKBACK
        value: "20"
      - key: AUTOBOTT_RECENT_WINNER_BIAS_MIN_SAMPLE
        value: "2"
      - key: AUTOBOTT_RECENT_WINNER_BIAS_WIN_RATE
        value: "0.67"
      - key: AUTOBOTT_RECENT_WINNER_BIAS_CONSECUTIVE_WINS
        value: "2"
      - key: AUTOBOTT_PAPER_ONLY
        value: "true"
      - key: AUTOBOTT_DASHBOARD_AUTH_TOKEN
        generateValue: true
      - key: AUTOBOTT_MANUAL_MIRROR_MAX_CONTRACT_COST
        value: "100"
      - key: AUTOBOTT_MANUAL_MIRROR_MAX_SIGNAL_AGE_MINUTES
        value: "30"
      - key: AUTOBOTT_SESSION_AUTOSTART
        value: "true"
      - key: AUTOBOTT_SESSION_RUN_FOREVER
        value: "true"
      - key: AUTOBOTT_SESSION_SYMBOLS
        value: TOP_OPTIONS_100,VXX,UVXY
      - key: AUTOBOTT_SESSION_PRIORITY_SYMBOLS
        value: VXX,UVXY,SPY,QQQ
      - key: AUTOBOTT_VOLATILITY_HEDGE_SYMBOLS
        value: VXX,UVXY
      - key: AUTOBOTT_SESSION_INTERVAL_SECONDS
        value: "90"
      - key: AUTOBOTT_SESSION_SYMBOL_BATCH_SIZE
        value: "10"
      - key: AUTOBOTT_SESSION_MAX_CYCLES
        sync: false
      - key: AUTOBOTT_SESSION_QUANTITY
        value: "1"
      - key: AUTOBOTT_SESSION_POSITION_COUNT
        value: "0"
      - key: AUTOBOTT_SESSION_DAILY_PNL
        value: "0.0"
      - key: AUTOBOTT_SESSION_START_TIME
        value: "09:35"
      - key: AUTOBOTT_SESSION_END_TIME
        value: "15:55"
      - key: AUTOBOTT_SESSION_MARKET_TIMEZONE
        value: America/New_York
      - key: AUTOBOTT_SESSION_ARM_PAPER_EXECUTION
        value: "true"
      - key: AUTOBOTT_DATA_ROOT
        value: /var/data/autobott/data
      - key: AUTOBOTT_ARTIFACTS_ROOT
        value: /var/data/autobott/artifacts
      - key: AUTOBOTT_GATE_PATH
        value: /var/data/autobott/data/PHASE1_CYCLE_GATE.json
