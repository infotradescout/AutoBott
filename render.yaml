services:
  - type: web
    name: autobott-phase1-dashboard
    runtime: python
    buildCommand: pip install .
    startCommand: python -m autobott_v2.dashboard_app
    healthCheckPath: /api/health
    disks:
      - name: autobott-runtime
        mountPath: /var/data/autobott
        sizeGB: 1
    envVars:
      - key: ALPACA_ENV
        value: paper
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: AUTOBOTT_LIVE_TRADING_ENABLED
        value: "false"
      - key: AUTOBOTT_ALLOW_ORDER_PLACEMENT
        value: "true"
      - key: AUTOBOTT_PAPER_TRADE_ALL_PASSED_SIGNALS
        value: "true"
      - key: AUTOBOTT_PAPER_MAX_NEW_ENTRY_ATTEMPTS_PER_LOOP
        value: "25"
      - key: AUTOBOTT_PAPER_MAX_OPEN_ENTRY_BUY_ORDERS
        value: "25"
      - key: AUTOBOTT_PAPER_ONLY
        value: "true"
      - key: AUTOBOTT_DASHBOARD_AUTH_TOKEN
        generateValue: true
      - key: AUTOBOTT_SESSION_AUTOSTART
        value: "true"
      - key: AUTOBOTT_SESSION_SYMBOLS
        value: TOP_OPTIONS_100
      - key: AUTOBOTT_SESSION_INTERVAL_SECONDS
        value: "90"
      - key: AUTOBOTT_SESSION_SYMBOL_BATCH_SIZE
        value: "10"
      - key: AUTOBOTT_SESSION_MAX_CYCLES
        sync: false
      - key: AUTOBOTT_SESSION_QUANTITY
        value: "1"
      - key: AUTOBOTT_SESSION_POSITION_COUNT
        value: "0"
      - key: AUTOBOTT_SESSION_DAILY_PNL
        value: "0.0"
      - key: AUTOBOTT_SESSION_START_TIME
        value: "09:35"
      - key: AUTOBOTT_SESSION_END_TIME
        value: "15:55"
      - key: AUTOBOTT_SESSION_MARKET_TIMEZONE
        value: America/New_York
      - key: AUTOBOTT_SESSION_ARM_PAPER_EXECUTION
        value: "true"
      - key: AUTOBOTT_DATA_ROOT
        value: /var/data/autobott/data
      - key: AUTOBOTT_ARTIFACTS_ROOT
        value: /var/data/autobott/artifacts
      - key: AUTOBOTT_GATE_PATH
        value: /var/data/autobott/data/PHASE1_CYCLE_GATE.json
