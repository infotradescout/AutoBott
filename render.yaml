services:
  - type: web
    name: autobott-phase1-dashboard
    runtime: python
    buildCommand: pip install .
    startCommand: python -m autobott_v2.dashboard_app
    healthCheckPath: /api/health
    disks:
      - name: autobott-runtime
        mountPath: /var/data/autobott
        sizeGB: 1
    envVars:
      # Connection and hard safety controls belong in deployment config.
      # Strategy-critical values are code-owned in hosted_policy.py so a stale
      # Render variable cannot silently keep an obsolete trading policy alive.
      - key: ALPACA_ENV
        value: paper
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: AUTOBOTT_LIVE_TRADING_ENABLED
        value: "false"
      - key: AUTOBOTT_ALLOW_ORDER_PLACEMENT
        value: "true"
      - key: AUTOBOTT_PAPER_ONLY
        value: "true"
      - key: AUTOBOTT_MAX_POSITION_COST
        value: "1000"
      - key: AUTOBOTT_MAX_OPEN_POSITIONS
        value: "6"
      - key: AUTOBOTT_MAX_DAILY_LOSS
        value: "750"
      - key: AUTOBOTT_PAPER_IGNORE_POSITION_COST_LIMIT
        value: "false"
      - key: AUTOBOTT_PAPER_TRADE_ALL_PASSED_SIGNALS
        value: "true"
      - key: AUTOBOTT_PAPER_MAX_NEW_ENTRY_ATTEMPTS_PER_LOOP
        value: "3"
      - key: AUTOBOTT_PAPER_MAX_OPEN_ENTRY_BUY_ORDERS
        value: "6"
      - key: AUTOBOTT_ENTRY_LIMIT_EXTRA
        value: "0.02"
      - key: AUTOBOTT_PENDING_ENTRY_MAX_AGE_SECONDS
        value: "180"
      - key: AUTOBOTT_OPEN_DRAWDOWN_GUARD_ENABLED
        value: "true"
      - key: AUTOBOTT_OPEN_DRAWDOWN_GUARD_MAX_UNREALIZED_LOSS
        value: "750"
      - key: AUTOBOTT_OPEN_DRAWDOWN_GUARD_MIN_LOSERS
        value: "3"
      - key: AUTOBOTT_OPEN_DRAWDOWN_GUARD_LOSS_RATE
        value: "0.60"
      - key: AUTOBOTT_DEFINED_RISK_SPREADS_ENABLED
        value: "true"
      - key: AUTOBOTT_SINGLE_LEG_REAL_ENTRIES_DISABLED
        value: "true"
      - key: AUTOBOTT_CORE_RUNNER_ENABLED
        value: "true"
      - key: AUTOBOTT_CORE_RUNNER_ATOMIC_MLEG_REQUIRED
        value: "false"
      - key: AUTOBOTT_MANUAL_MIRROR_MAX_CONTRACT_COST
        value: "100"
      - key: AUTOBOTT_MANUAL_MIRROR_MAX_SIGNAL_AGE_MINUTES
        value: "30"
      - key: AUTOBOTT_SESSION_AUTOSTART
        value: "true"
      - key: AUTOBOTT_SESSION_RUN_FOREVER
        value: "true"
      - key: AUTOBOTT_SESSION_SYMBOLS
        value: VIX,VXX,UVXY,TOP_OPTIONS_100
      - key: AUTOBOTT_SESSION_PRIORITY_SYMBOLS
        value: VIX,VXX,UVXY,SPY,QQQ
      - key: AUTOBOTT_VOLATILITY_HEDGE_SYMBOLS
        value: VIX,VXX,UVXY
      - key: AUTOBOTT_SESSION_INTERVAL_SECONDS
        value: "90"
      - key: AUTOBOTT_SESSION_SYMBOL_BATCH_SIZE
        value: "25"
      - key: AUTOBOTT_SESSION_MAX_CYCLES
        sync: false
      - key: AUTOBOTT_SESSION_QUANTITY
        value: "1"
      - key: AUTOBOTT_SESSION_POSITION_COUNT
        value: "0"
      - key: AUTOBOTT_SESSION_DAILY_PNL
        value: "0.0"
      - key: AUTOBOTT_SESSION_START_TIME
        value: "09:35"
      - key: AUTOBOTT_SESSION_END_TIME
        value: "15:55"
      - key: AUTOBOTT_SESSION_MARKET_TIMEZONE
        value: America/New_York
      - key: AUTOBOTT_SESSION_ARM_PAPER_EXECUTION
        value: "true"
      - key: AUTOBOTT_DATA_ROOT
        value: /var/data/autobott/data
      - key: AUTOBOTT_ARTIFACTS_ROOT
        value: /var/data/autobott/artifacts
      - key: AUTOBOTT_GATE_PATH
        value: /var/data/autobott/data/PHASE1_CYCLE_GATE.json
      - key: AUTOBOTT_SNAPSHOT_MAX_BYTES
        value: "134217728"
      - key: AUTOBOTT_MIN_FREE_BYTES
        value: "134217728"
      - key: AUTOBOTT_CAPTURE_OPTION_QUOTE_FILES
        value: "false"
