name: Entry quality offline validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/validate_offline.py'
      - '.github/workflows/entry-quality-validation.yml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  offline-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact pull request merge revision
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Prepare isolated Python 3.12 test environment
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv "${RUNNER_TEMP}/entry-validation-env"
          "${RUNNER_TEMP}/entry-validation-env/bin/python" -m pip install 'pytest==9.0.2'
      - name: Run complete source-owned offline Python suite
        run: |
          "${RUNNER_TEMP}/entry-validation-env/bin/python" scripts/validate_offline.py
