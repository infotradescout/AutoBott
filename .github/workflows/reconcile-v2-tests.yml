name: Reconcile v2 tests

on:
  push:
    branches:
      - rebuild/unified-trading-brain

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/unified-trading-brain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile stale policy assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('tests/test_dashboard_app.py')
          text = dashboard.read_text(encoding='utf-8')
          old = 'assert payload["policy_version"] == "hosted-vix-profit-v1"'
          new = 'assert payload["policy_version"] == "hosted-core-runner-v2"'
          if old not in text:
              raise SystemExit('dashboard policy assertion not found')
          text = text.replace(old, new, 1)

          old = "    assert 'key: AUTOBOTT_RECENT_LOSS_GUARD_ENABLED\\n        value: \\\"true\\\"' in render_config"
          new = "    assert 'startCommand: python -m autobott_v2.dashboard_app_v2' in render_config\n    assert 'key: AUTOBOTT_RECENT_LOSS_GUARD_ENABLED' not in render_config"
          if old not in text:
              raise SystemExit('render recent-loss assertion not found')
          text = text.replace(old, new, 1)
          dashboard.write_text(text, encoding='utf-8')

          outcomes = Path('tests/test_trade_outcomes.py')
          text = outcomes.read_text(encoding='utf-8')

          marker = 'def test_hosted_summary_is_current_policy_but_daily_pnl_is_account_wide'
          start = text.index(marker)
          end = text.index('\ndef test_daily_realized_pnl_uses_new_york_trading_date', start)
          block = text[start:end]
          block2 = block.replace('"hosted-vix-profit-v1"', '"hosted-core-runner-v2"')
          if block2 == block:
              raise SystemExit('hosted summary policy strings not found')
          text = text[:start] + block2 + text[end:]

          marker = 'def test_hosted_summary_excludes_pre_fix_exit_attribution'
          start = text.index(marker)
          block = text[start:]
          block2 = block.replace('"hosted-vix-profit-v1"', '"hosted-core-runner-v2"')
          if block2 == block:
              raise SystemExit('pre-fix policy strings not found')
          text = text[:start] + block2
          outcomes.write_text(text, encoding='utf-8')
          PY
      - name: Install project and pytest
        run: python -m pip install --upgrade pip && pip install . pytest
      - name: Run full local-semantics suite
        run: env -u RENDER -u RENDER_SERVICE_ID -u PORT pytest -q
      - name: Commit reconciled tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_dashboard_app.py tests/test_trade_outcomes.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Align tests with unified core runner policy"
          git push origin HEAD:rebuild/unified-trading-brain
